name: Build ophub kmods from ImmortalWrt definitions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      # 第一步：用 ophub 的编译脚本产出内核配置和 .ko 文件
      - name: Compile ophub kernel with CIFS enabled
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-armbian.git
          cd amlogic-s9xxx-armbian
          # 创建配置目录，启用 CIFS
          mkdir -p compile-kernel/tools/config
          echo "CONFIG_CIFS=m" >> compile-kernel/tools/config/config
          echo "CONFIG_CIFS_SMB_DIRECT=m" >> compile-kernel/tools/config/config
          echo "CONFIG_CIFS_UPCALL=m" >> compile-kernel/tools/config/config
          echo "CONFIG_CIFS_XATTR=y" >> compile-kernel/tools/config/config
          echo "CONFIG_NLS_UTF8=m" >> compile-kernel/tools/config/config
          # 编译内核，签名保持 -ophub
          sudo ./recompile -k 6.18.y -n -ophub -m modules
          
          # 收集内核构建目录（包含 .ko 和内核配置）
          KERNEL_BUILD_DIR=$(find /opt/kernel/compile-kernel/output -name "*.tar.gz" | head -1)
          mkdir -p /tmp/ophub-kernel
          tar -xzf "$KERNEL_BUILD_DIR" -C /tmp/ophub-kernel

      # 第二步：克隆 ImmortalWrt 源码，获取 kmod 包定义
      - name: Clone ImmortalWrt for kmod definitions
        run: |
          git clone --depth 1 --branch v25.12.1 https://github.com/immortalwrt/immortalwrt.git /tmp/immortalwrt
          cd /tmp/immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 第三步：用 ImmortalWrt 的 KernelPackage 定义 + ophub 的内核产物生成 apk
      - name: Build kmod apks using ImmortalWrt package definitions
        run: |
          cd /tmp/immortalwrt
          # 配置目标平台
          echo "CONFIG_TARGET_armsr=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          # 覆盖内核相关变量，指向 ophub 的构建产物
          export LINUX_DIR=/tmp/ophub-kernel
          export KERNEL_BUILD_DIR=/tmp/ophub-kernel
          # 选择需要的 kmod
          echo "CONFIG_PACKAGE_kmod-fs-cifs=m" >> .config
          echo "CONFIG_PACKAGE_kmod-nls-utf8=m" >> .config
          # 用 ALL_KMODS 尝试全量（可能失败，先保留 CIFS）
          # echo "CONFIG_ALL_KMODS=y" >> .config
          make defconfig
          # 只编译内核模块包
          make -j$(nproc) package/kernel/linux/compile V=s

      - name: Collect apk packages
        run: |
          mkdir -p output
          find /tmp/immortalwrt/bin -name "kmod-*.apk" -exec cp {} output/ \;
          find /tmp/immortalwrt/bin -name "packages.adb" -exec cp {} output/ \;
          ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ophub-kmods
          path: output/
          if-no-files-found: warn